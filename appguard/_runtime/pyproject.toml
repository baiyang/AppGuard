[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "Cython==3.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "appguard-product-runtime"
dynamic = ["version"]
description = "Private product-keyed AppGuard runtime; distribute only with its application"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = ["cryptography==45.0.4", "werkzeug>=3.1,<4"]
classifiers = ["Private :: Do Not Upload"]

[tool.setuptools]
packages = []
include-package-data = false
