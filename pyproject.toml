[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "Cython==3.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "appguard-runtime"
version = "0.3.0"
description = "Encrypted Python modules and offline product licensing for backend APIs"
requires-python = ">=3.11,<3.12"
dependencies = ["cryptography==45.0.4", "werkzeug>=3.1,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
